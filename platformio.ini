[platformio]
default_envs = teensy41

[env]
platform = https://github.com/tsandmann/platform-teensy.git#f2a89fab6fbe936dc383a6565872eb30545984a6
framework = arduino
lib_deps = https://github.com/tsandmann/freertos-teensy.git#b1943409de50e0514469ae0fc69a6f9ae17f6118
build_flags = -Wformat=1 -DUSB_SERIAL
upload_flags = -v
upload_protocol = teensy-cli

[env:teensy40]
board = teensy40
build_flags = ${env.build_flags} -DTEENSY_OPT_FASTER_LTO

[env:teensy41]
board = teensy41
lib_deps = https://github.com/tsandmann/freertos-teensy.git
    https://github.com/ssilverman/QNEthernet.git#9b6018d81d91a86c6f04fa7814fb8884ed8ef128
build_flags = ${env.build_flags} -DQNETHERNET_DO_LOOP_IN_YIELD=0
